<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keepr</title>
    <!-- Painted before React starts, in the theme's background, so no white frame shows. Keep in step with --ground in src/styles.css. -->
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; background: #ffffff; }
      @media (prefers-color-scheme: dark) { html, body { background: #1e1e20; } }
      html.tray, html.tray body { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
