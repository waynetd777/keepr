<!-- The DMG window's background, 660×400. make_dmg.py puts the icons on it: the app centred at
     (165, 230), Applications at (495, 230). The mark is src/icons.tsx's Mark in the light theme. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body { background: linear-gradient(#ffffff, #f0f2f1); color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; position: relative; -webkit-font-smoothing: antialiased; }
  .brand { position: absolute; top: 34px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-weight: 650; letter-spacing: -0.02em; font-size: 34px; }
  .tag { position: absolute; top: 96px; width: 100%; text-align: center; font-size: 15px; color: #57575c; }
  .arrow { position: absolute; left: 250px; top: 206px; width: 160px; height: 48px; }
  .hint { position: absolute; top: 334px; width: 100%; text-align: center; font-size: 15px; color: #57575c; }
  .hint b { font-weight: 600; color: #1d1d1f; }
</style>
<body>
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 28 28"><rect width="28" height="28" rx="8" fill="#0f7a5c" /><path d="M8 10h12M8 14h12M8 18h7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none" /></svg>
    Keepr
  </div>
  <div class="tag">Backups for your Mac. Every file. Every version. Kept.</div>
  <svg class="arrow" viewBox="0 0 160 48" fill="none" stroke="#0f7a5c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 24 H146" /><path d="M126 8 L148 24 L126 40" />
  </svg>
  <div class="hint">Drag <b>Keepr</b> onto <b>Applications</b> to install it</div>
</body>
