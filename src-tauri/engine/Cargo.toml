[package]
name = "keepr-engine"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "Keepr's backup repository: chunking, de-duplication, compression, encryption, snapshots, restore and pruning"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
fastcdc = "5"
blake3 = "1"
zstd = "0.14"
chacha20poly1305 = "0.11"
argon2 = "0.6"
rand = "0.10"
hex = "0.4"
rayon = "1"
globset = "0.4"
ignore = "0.4"
filetime = "0.2"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
hmac = "0.13"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
