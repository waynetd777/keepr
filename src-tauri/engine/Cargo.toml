[package]
name = "keepr-engine"
version = "0.1.0"
description = "Keepr's backup repository: chunking, de-duplication, compression, encryption, snapshots, restore and pruning"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
fastcdc = "3"
blake3 = "1"
zstd = "0.13"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
rayon = "1"
globset = "0.4"
ignore = "0.4"
filetime = "0.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
