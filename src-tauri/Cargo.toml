[package]
name = "keepr"
version = "1.0.22"
description = "A backup app for macOS and Windows"
authors = ["Wayne Davies"]
license = "GPL-3.0-or-later"
edition = "2021"

[workspace]
members = ["engine"]

[lib]
name = "keepr_lib"
# rlib only: the app links only into its own binary, and each extra crate type is another full LTO link.
crate-type = ["rlib"]

# The binary name is what the Dock and Activity Monitor show in `tauri dev`.
[[bin]]
name = "Keepr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keepr-engine = { path = "engine" }
ignore = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
similar = "2"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
base64 = "0.21"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# A second launch brings the running copy to the front (macOS's LaunchServices does that itself).
tauri-plugin-single-instance = "2"
# Keepr Helper, the service that makes still copies and reads the change journal (helper_service_win.rs).
windows-service = "0.8"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Networking_Connectivity",
  "Win32_Foundation",
  "Win32_NetworkManagement_NetManagement",
  "Win32_NetworkManagement_WNet",
  "Win32_NetworkManagement_Dns",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSValue", "NSURL", "NSArray", "NSDictionary"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication"] }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = ["std", "QLPreviewPanel", "QLPreviewItem", "objc2-app-kit"] }

[dev-dependencies]
tempfile = "3"

# Thin LTO with parallel codegen units: incremental release builds in ~20s instead of minutes.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# `make dev` and `make check` rebuild constantly; debug info for every dependency is most of
# the link time and nobody steps through them in a debugger here.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

# The engine does the chunking, hashing, compression and encryption: unoptimised, a backup in a
# debug build takes many times the CPU a release build does.
[profile.dev.package.keepr-engine]
opt-level = 2
