[package]
name = "keepr"
version = "1.0.0"
description = "A backup app for macOS"
authors = ["Wayne Davies"]
edition = "2021"

[workspace]
members = ["engine"]

[lib]
name = "keepr_lib"
# rlib only: this app is macOS-only, and each extra crate type is another full LTO link.
crate-type = ["rlib"]

# The binary name is what the Dock and Activity Monitor show in `tauri dev`.
[[bin]]
name = "Keepr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keepr-engine = { path = "engine" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
libc = "0.2"
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
block2 = "0.6"
similar = "2"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
base64 = "0.21"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSValue", "NSURL", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication"] }

[dev-dependencies]
tempfile = "3"

# Thin LTO with parallel codegen units: incremental release builds in ~20s instead of minutes.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# `make dev` and `make check` rebuild constantly; debug info for every dependency is most of
# the link time and nobody steps through them in a debugger here.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
